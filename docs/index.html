<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Прайс на рекламу в сообществах ВКонтакте</title>
  <meta name="description" content="Актуальный прайс на размещение рекламы в наших сообществах ВКонтакте.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Crect%20width='100'%20height='100'%20rx='22'%20fill='%232787f5'/%3E%3Ctext%20x='50'%20y='70'%20font-size='52'%20text-anchor='middle'%20fill='white'%20font-family='Arial'%20font-weight='bold'%3E%E2%82%BD%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <header class="hero">
      <div class="hero-badge">Прайс актуален на <span id="updated">—</span></div>
      <h1 id="title">Реклама в наших сообществах</h1>
      <p class="subtitle" id="subtitle"></p>
      <div class="hero-actions" id="contacts"></div>
      <div class="hero-stats" id="stats"></div>
    </header>

    <main>
      <section id="publics" class="grid" aria-label="Сообщества и цены"></section>

      <section id="conditions-section" hidden>
        <h2 class="section-title">Условия размещения</h2>
        <div class="card conditions">
          <ul id="conditions"></ul>
        </div>
      </section>
    </main>

    <footer>
      <span>Прайс обновлён <span id="footer-updated">—</span></span>
      <div class="footer-links" id="footer-contacts"></div>
    </footer>
  </div>
  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
