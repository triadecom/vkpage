name: test-vk
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Проверка доступности ВК с раннера
        run: |
          for i in 1 2 3; do
            CODE=$(curl -s -o /tmp/page.html -w "%{http_code}" --max-time 20 -A "facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)" "https://vk.com/team")
            SIZE=$(wc -c < /tmp/page.html)
            OG=$(grep -c 'og:image' /tmp/page.html || true)
            VIEWS=$(grep -c 'like_views' /tmp/page.html || true)
            echo "try $i: code=$CODE size=$SIZE og_image=$OG like_views=$VIEWS"
            sleep 2
          done
